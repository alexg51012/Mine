```html
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mango & Mustard</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Trebuchet MS", sans-serif;

      background: linear-gradient(
        -45deg,
        #ffb300,
        #ff8c42,
        #ffd447,
        #d4a017,
        #ff7b00,
        #ffc93c
      );

      background-size: 500% 500%;
      animation: backgroundFlow 18s ease infinite;
      position: relative;
    }

    body::before {
      content: "";
      position: absolute;
      width: 140%;
      height: 140%;

      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.2), transparent 20%),
        radial-gradient(circle at 80% 30%, rgba(255,255,255,0.15), transparent 25%),
        radial-gradient(circle at 30% 80%, rgba(255,255,255,0.18), transparent 20%),
        radial-gradient(circle at 70% 70%, rgba(255,255,255,0.12), transparent 20%);

      animation: floatingLights 20s linear infinite;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 2;

      padding: 50px 70px;
      border-radius: 35px;

      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(16px);

      border: 2px solid rgba(255,255,255,0.2);

      box-shadow:
        0 10px 40px rgba(0,0,0,0.25),
        0 0 40px rgba(255,215,0,0.3);

      text-align: center;

      animation:
        floatCard 5s ease-in-out infinite,
        glowPulse 4s ease-in-out infinite;
    }

    .title {
      font-size: clamp(2.5rem, 6vw, 5rem);
      font-weight: 900;
      letter-spacing: 3px;
      text-transform: uppercase;

      background: linear-gradient(
        90deg,
        #ffffff,
        #fff176,
        #ff9800,
        #ffffff,
        #ffd54f,
        #ff6f00,
        #ffffff
      );

      background-size: 400% 400%;

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;

      animation:
        rainbowText 6s ease infinite,
        textGlow 3s ease-in-out infinite;

      text-shadow:
        0 0 10px rgba(255,255,255,0.4),
        0 0 20px rgba(255,200,0,0.5);
    }

    .subtitle {
      margin-top: 18px;
      font-size: 1.1rem;
      color: rgba(255,255,255,0.85);
      letter-spacing: 1px;

      animation: fadeIn 3s ease;
    }

    .spark {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: white;
      opacity: 0.8;
      animation: sparkle 6s linear infinite;
    }

    .spark:nth-child(1) {
      top: 10%;
      left: 15%;
      animation-delay: 0s;
    }

    .spark:nth-child(2) {
      top: 20%;
      left: 80%;
      animation-delay: 1s;
    }

    .spark:nth-child(3) {
      top: 75%;
      left: 20%;
      animation-delay: 2s;
    }

    .spark:nth-child(4) {
      top: 85%;
      left: 75%;
      animation-delay: 3s;
    }

    .spark:nth-child(5) {
      top: 50%;
      left: 50%;
      animation-delay: 4s;
    }

    .spark:nth-child(6) {
      top: 35%;
      left: 35%;
      animation-delay: 5s;
    }

    .ring {
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;

      border: 2px solid rgba(255,255,255,0.08);

      animation: rotateRing 20s linear infinite;
    }

    .ring2 {
      width: 700px;
      height: 700px;
      animation-direction: reverse;
      animation-duration: 30s;
    }

    .ring3 {
      width: 900px;
      height: 900px;
      animation-duration: 40s;
    }

    @keyframes backgroundFlow {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    @keyframes rainbowText {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    @keyframes floatCard {
      0% {
        transform: translateY(0px);
      }

      50% {
        transform: translateY(-15px);
      }

      100% {
        transform: translateY(0px);
      }
    }

    @keyframes glowPulse {
      0% {
        box-shadow:
          0 10px 40px rgba(0,0,0,0.25),
          0 0 30px rgba(255,200,0,0.2);
      }

      50% {
        box-shadow:
          0 10px 50px rgba(0,0,0,0.35),
          0 0 60px rgba(255,220,0,0.5);
      }

      100% {
        box-shadow:
          0 10px 40px rgba(0,0,0,0.25),
          0 0 30px rgba(255,200,0,0.2);
      }
    }

    @keyframes textGlow {
      0% {
        filter: drop-shadow(0 0 8px rgba(255,255,255,0.3));
      }

      50% {
        filter: drop-shadow(0 0 20px rgba(255,255,255,0.8));
      }

      100% {
        filter: drop-shadow(0 0 8px rgba(255,255,255,0.3));
      }
    }

    @keyframes sparkle {
      0% {
        transform: scale(0) translateY(0);
        opacity: 0;
      }

      25% {
        opacity: 1;
      }

      50% {
        transform: scale(1.5) translateY(-20px);
        opacity: 0.8;
      }

      100% {
        transform: scale(0) translateY(-50px);
        opacity: 0;
      }
    }

    @keyframes rotateRing {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    @keyframes floatingLights {
      0% {
        transform: translateY(0px) rotate(0deg);
      }

      50% {
        transform: translateY(-30px) rotate(180deg);
      }

      100% {
        transform: translateY(0px) rotate(360deg);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0px);
      }
    }

    @media (max-width: 700px) {
      .container {
        width: 90%;
        padding: 35px 20px;
      }

      .subtitle {
        font-size: 0.95rem;
      }
    }
  </style>
</head>

<body>

  <div class="ring"></div>
  <div class="ring ring2"></div>
  <div class="ring ring3"></div>

  <div class="spark"></div>
  <div class="spark"></div>
  <div class="spark"></div>
  <div class="spark"></div>
  <div class="spark"></div>
  <div class="spark"></div>

  <div class="container">
    <div class="title">
      where mango and mustard combine
    </div>

    <div class="subtitle">
      vibrant • smooth • glowing • animated
    </div>
  </div>

</body>
</html>
```
