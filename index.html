<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>67 Effect</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  font-family:Arial, sans-serif;

  background: radial-gradient(circle at top,
    #ffb300,
    #ff7b00,
    #111
  );
}

/* moving grid */
body::before{
  content:"";
  position:absolute;
  width:200%;
  height:200%;
  background:
    linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
  background-size:50px 50px;
  transform:rotate(15deg);
  animation:moveGrid 10s linear infinite;
  opacity:0.4;
}

@keyframes moveGrid{
  from{transform:translate(0,0) rotate(15deg);}
  to{transform:translate(-50px,-50px) rotate(15deg);}
}

.card{
  position:relative;
  padding:60px 80px;
  border-radius:30px;
  text-align:center;

  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(15px);

  border:1px solid rgba(255,255,255,0.2);

  box-shadow:
    0 0 40px rgba(255,180,0,0.4),
    0 0 80px rgba(255,80,0,0.2);

  animation:float 3s ease-in-out infinite;
}

.text{
  font-size:2.5rem;
  font-weight:900;
  color:white;
  text-transform:uppercase;
  letter-spacing:2px;
}

/* 67 glitch core */
.glitch67{
  font-size:7rem;
  font-weight:900;
  margin-top:20px;
  position:relative;
  color:white;

  animation:rgbShift 1.5s infinite linear;
}

.glitch67::before,
.glitch67::after{
  content:"67";
  position:absolute;
  top:0;
  left:0;
  width:100%;
}

.glitch67::before{
  color:#ff00ff;
  transform:translate(-4px,2px);
  animation:glitch1 0.8s infinite;
}

.glitch67::after{
  color:#00ffff;
  transform:translate(4px,-2px);
  animation:glitch2 0.8s infinite;
}

/* animations */
@keyframes float{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-15px);}
}

@keyframes rgbShift{
  0%{filter:hue-rotate(0deg);}
  100%{filter:hue-rotate(360deg);}
}

@keyframes glitch1{
  0%,100%{transform:translate(-4px,2px);}
  50%{transform:translate(-6px,-2px);}
}

@keyframes glitch2{
  0%,100%{transform:translate(4px,-2px);}
  50%{transform:translate(6px,2px);}
}

.scanlines{
  position:absolute;
  width:100%;
  height:100%;
  background: repeating-linear-gradient(
    to bottom,
    rgba(255,255,255,0.05),
    rgba(255,255,255,0.05) 1px,
    transparent 2px,
    transparent 4px
  );
  pointer-events:none;
  mix-blend-mode:overlay;
}
</style>
</head>

<body>

<div class="scanlines"></div>

<div class="card">
  <div class="text">where mango and mustard combine</div>
  <div class="glitch67">67</div>
</div>

</body>
</html>
