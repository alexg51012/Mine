<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Mango & Mustard 67 Effect</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  font-family:Arial, sans-serif;

  background: radial-gradient(circle at top,
    #ffb300,
    #ff7b00,
    #111
  );
}

/* moving glow grid */
body::before{
  content:"";
  position:absolute;
  width:200%;
  height:200%;
  background:
    linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
  background-size:50px 50px;
  animation:moveGrid 10s linear infinite;
  transform:rotate(15deg);
  opacity:0.4;
}

@keyframes moveGrid{
  from{transform:translate(0,0) rotate(15deg);}
  to{transform:translate(-50px,-50px) rotate(15deg);}
}

/* center card */
.card{
  position:relative;
  padding:60px 80px;
  border-radius:30px;
  text-align:center;

  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(15px);

  border:1px solid rgba(255,255,255,0.2);

  box-shadow:
    0 0 40px rgba(255,180,0,0.4),
    0 0 80px rgba(255,80,0,0.2);

  animation:float 3s ease-in-out infinite;
}

/* glitch text */
.text{
  font-size:3rem;
  font-weight:900;
  color:white;
  position:relative;
  text-transform:uppercase;
  letter-spacing:2px;

  animation:rgbShift 2s infinite alternate;
}

.text::before,
.text::after{
  content:attr(data-text);
  position:absolute;
  left:0;
  top:0;
  width:100%;
}

.text::before{
  color:#ff00ff;
  z-index:-1;
  transform:translateX(-3px);
  animation:glitch1 1s infinite;
}

.text::after{
  color:#00ffff;
  z-index:-2;
  transform:translateX(3px);
  animation:glitch2 1s infinite;
}

/* mango + mustard */
.icons{
  font-size:4rem;
  margin-top:20px;
  animation:spin 6s linear infinite;
}

/* animations */
@keyframes float{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-15px);}
}

@keyframes rgbShift{
  0%{filter:hue-rotate(0deg);}
  100%{filter:hue-rotate(360deg);}
}

@keyframes glitch1{
  0%,100%{transform:translate(0,0);}
  25%{transform:translate(-2px,2px);}
  50%{transform:translate(-4px,-2px);}
  75%{transform:translate(-2px,1px);}
}

@keyframes glitch2{
  0%,100%{transform:translate(0,0);}
  25%{transform:translate(2px,-2px);}
  50%{transform:translate(4px,2px);}
  75%{transform:translate(2px,-1px);}
}

@keyframes spin{
  from{transform:rotate(0deg);}
  to{transform:rotate(360deg);}
}

/* scanlines */
.scanlines{
  position:absolute;
  width:100%;
  height:100%;
  background: repeating-linear-gradient(
    to bottom,
    rgba(255,255,255,0.05),
    rgba(255,255,255,0.05) 1px,
    transparent 2px,
    transparent 4px
  );
  pointer-events:none;
  mix-blend-mode:overlay;
}
</style>
</head>

<body>

<div class="scanlines"></div>

<div class="card">
  <div class="text" data-text="where mango and mustard combine">
    where mango and mustard combine
  </div>

  <div class="icons">
    🥭 + 🟡🧴
  </div>
</div>

</body>
</html>
